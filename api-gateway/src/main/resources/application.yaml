server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: student-service
              uri: lb://student-service
              predicates:
                - Path=/api/students/**

            - id: course-service
              uri: lb://course-service
              predicates:
                - Path=/api/courses/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/